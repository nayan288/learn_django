{% extends 'base.html' %}

{% block title %}
Add Student
{% endblock %}

{% block more_css %}
{% endblock %}


{% block conetnt %}

<div class="container">
    <div class="row">
        <div class="col-5 m-auto">
            <h1>Add Student</h1>
            <form action="{% url 'addstudent' %}" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="stu_name" class="form-control" placeholder="Name" aria-label="Name"
                        aria-describedby="basic-addon1">
                </div>
                <div class="input-group">
                    <input type="email" name="stu_email" class="form-control" placeholder="Email" aria-label="Email"
                        aria-describedby="basic-addon1">
                </div>
                 <p class="fg-danger">{{ err_msg }}</p>
                <button type="submit" class="btn-solid theme-success">Submit</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
